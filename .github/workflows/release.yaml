name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump the current version, or release the exact version below (version)
        type: choice
        options: [version, patch, minor, major]
        default: version
      version:
        description: Exact version to release, X.Y.Z (only with bump set to version)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: devenv shell -- bash -e {0}

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      previous: ${{ steps.bump.outputs.previous }}

    steps:
      # The Commit job pushes before the `release` environment can stop a run from another branch.
      - name: Check branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release from main, not $GITHUB_REF"
            exit 1
          fi

      # Full history, for the tag the release notes start at.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      # cargo-release bumps from the version in Cargo.toml (the last release) and refuses to go back.
      # The version already in Cargo.toml changes nothing: a release that stopped after the Commit job
      # resumes with that version.
      # `cargo publish --dry-run`, not `cargo package`: it skips `publish = false` crates.
      - name: Bump the version and package every crate
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$BUMP" == version ]]; then
            target="${VERSION#v}"

            if [[ -z "$target" ]]; then
              echo "::error::Set the version to release, or pick a bump"
              exit 1
            fi
          elif [[ -n "$VERSION" ]]; then
            echo "::error::Set bump to version to release an exact version (bump: $BUMP, version: $VERSION)"
            exit 1
          else
            target="$BUMP"
          fi

          cargo release version "$target" --execute --no-confirm

          id="$(cargo pkgid -p drand)"
          version="${id##*[#@]}"

          if git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released"
            exit 1
          fi

          cargo publish --dry-run --workspace --locked --allow-dirty

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)"
          } >> "$GITHUB_OUTPUT"

  commit:
    name: Commit
    needs: package
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Set up git
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # The tag comes with the GitHub Release (`--no-tag`).
      # `cargo release commit` fails when there is nothing to commit: the version is already on main.
      - name: Bump, commit and push the version
        id: commit
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          cargo release version "$VERSION" --execute --no-confirm

          if ! git diff --quiet; then
            cargo release commit --execute --no-confirm
            cargo release push --no-tag --execute --no-confirm
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to crates.io
    needs: commit
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # cargo-release skips the versions already on crates.io, so a rerun publishes what is left. When
      # nothing is left it fails with "no packages selected": that is a successful rerun.
      # The checkout is the commit's SHA, a detached HEAD (`--allow-branch HEAD`); the Package job has
      # already built the packages (`--no-verify`).
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -o pipefail

          cargo release publish --workspace --no-verify --allow-branch HEAD --execute --no-confirm 2>&1 | tee "$RUNNER_TEMP/publish.log" \
            || grep -q 'no packages selected' "$RUNNER_TEMP/publish.log"

  release:
    name: GitHub Release
    needs: [package, commit, publish]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Every release is newer than the last (cargo-release does not go back), so GitHub marks it the
    # Latest release, unless it is a prerelease.
    steps:
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS: ${{ needs.package.outputs.previous }}
          TAG: ${{ needs.package.outputs.tag }}
          TARGET: ${{ needs.commit.outputs.sha }}
        run: |
          args=()
          [[ "$TAG" != *-* ]] || args+=(--prerelease)
          [[ -z "$PREVIOUS" ]] || args+=(--notes-start-tag "$PREVIOUS")

          gh release create "$TAG" --target "$TARGET" --generate-notes "${args[@]}"
