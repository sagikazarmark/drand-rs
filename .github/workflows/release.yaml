name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump the latest release, or release the exact version below (version)
        type: choice
        options: [version, patch, minor, major]
        default: version
      version:
        description: Exact version to release, X.Y.Z (only with bump version)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: devenv shell -- bash -e {0}

jobs:
  # Checks the release before anything changes: picks the version and builds every crate from its
  # package. Building runs the dependencies' build scripts and proc macros, so this job gets no write
  # access, and hands the Bump job the version alone.
  check:
    name: Check
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      # From the inputs and the repository's tags, before any checkout: an exact version, or a bump of
      # the latest release tag. It refuses a version that is already a tag, or older than the latest.
      # A bump from the tag, not from Cargo.toml: a release that stopped after the Bump job (its version
      # on main, untagged) resumes with the same bump.
      - name: Pick the version
        id: version
        uses: sagikazarmark/next-version@fc0401d3719a172991c36ec41f5e43419c30e90f # v0.3.0
        with:
          bump: ${{ inputs.bump }}
          version: ${{ inputs.version }}
          allow-prerelease: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      # cargo-release refuses to go back (a version bumped ahead by hand on main), and the version
      # already in Cargo.toml changes nothing.
      - name: Bump the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo release version "$VERSION" --execute --no-confirm

      # `cargo publish --dry-run`, not `cargo package`: it skips `publish = false` crates. Catches files
      # missing from the packages and dev-dependencies that `cargo publish` strips.
      - name: Build every crate from its package
        run: cargo publish --dry-run --workspace --locked --allow-dirty

  # Bumps the version on the default branch. It builds nothing.
  bump:
    name: Bump
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Set up git
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # `cargo release commit` fails when there is nothing to commit: the version is already on main.
      # `cargo release push` always runs: it is the release's branch check (`--allow-branch`, the
      # default branch here and `allow-branch` in Cargo.toml for local releases), and pushes nothing
      # when there is nothing new. The tag comes with the GitHub Release (`--no-tag`).
      - name: Bump, commit and push the version
        id: commit
        env:
          VERSION: ${{ needs.check.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cargo release version "$VERSION" --execute --no-confirm

          if ! git diff --quiet; then
            cargo release commit --execute --no-confirm
          fi

          cargo release push --no-tag --allow-branch "$DEFAULT_BRANCH" --execute --no-confirm

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to crates.io
    needs: bump
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # cargo-release skips the versions already on crates.io, so a rerun publishes what is left. When
      # nothing is left it fails with "no packages selected": that is a successful rerun.
      # The checkout is the commit's SHA, a detached HEAD: `--allow-branch HEAD`, as the Bump job has
      # already checked the branch. The Check job has already built the packages (`--no-verify`).
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -o pipefail

          cargo release publish --workspace --no-verify --allow-branch HEAD --execute --no-confirm 2>&1 | tee "$RUNNER_TEMP/publish.log" \
            || grep -q 'no packages selected' "$RUNNER_TEMP/publish.log"

  release:
    name: GitHub Release
    needs: [check, bump, publish]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Every release is newer than the last (next-version refuses an older one), so GitHub marks it the
    # Latest release, unless it is a prerelease.
    steps:
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          TARGET: ${{ needs.bump.outputs.sha }}
        run: gh release create "$TAG" --target "$TARGET" --generate-notes --prerelease="$PRERELEASE"
