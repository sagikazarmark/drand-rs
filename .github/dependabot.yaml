version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      cargo-ark:
        patterns:
          - "ark-*"
      cargo:
        patterns:
          - "*"
        exclude-patterns:
          - "ark-*"
    ignore:
      # sha2 must stay on the digest version arkworks uses (digest 0.10 as of arkworks 0.6).
      - dependency-name: sha2
        versions: [">=0.11"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
    exclude-paths:
      - .github/workflows/dagger.yaml
