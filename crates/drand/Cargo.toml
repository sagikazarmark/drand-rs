[package]
name = "drand"
version.workspace = true
description = "Fetch and strictly verify drand randomness beacons: no_std/wasm verifier core plus an async multi-relay client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["bls12-381", "default-tls"]
## BLS12-381 verification: drand's `default` and `quicknet` chains.
bls12-381 = ["dep:ark-bls12-381", "dep:ark-ec", "dep:ark-ff", "dep:ark-serialize"]
## `From<std::time::SystemTime>` for `UnixTime`.
std = []
## The async HTTP client: native targets (on tokio) and wasm32-unknown-unknown
## (on the JS host's `fetch` and `setTimeout`: browsers, Cloudflare Workers).
## Compiled out on WASI. HTTP goes through the `HttpTransport` trait; without
## `reqwest`, `ClientBuilder::http_transport` is mandatory.
client = [
    "std",
    "dep:bytes",
    "dep:http",
    "dep:tokio",
    "dep:futures-util",
    "dep:tracing",
    "dep:web-time",
    "dep:gloo-timers",
    "dep:send_wrapper",
]
## The default transport, `ReqwestTransport` (implies `client`). The only place
## `reqwest` shows in the API; leave it off to bring your own `HttpTransport`
## and keep reqwest out of the build.
reqwest = ["client", "dep:reqwest"]
## `TowerTransport`: an `HttpTransport` over any `tower::Service` that speaks
## `http::Request` / `http::Response` (implies `client`). `tower-reqwest` on
## native targets, `tower-worker-fetch` on Cloudflare Workers, or your own stack.
tower = ["client", "dep:tower-service", "dep:http-body", "dep:http-body-util"]
## TLS for `ReqwestTransport`. These do nothing without `reqwest`. `default-tls`
## is reqwest's default backend (rustls in reqwest 0.13); to pick another,
## disable default features.
default-tls = ["reqwest?/default-tls"]
rustls = ["reqwest?/rustls"]
native-tls = ["reqwest?/native-tls"]
## A deterministic, signing test chain. Anyone with its seed can forge beacons.
test-chain = ["bls12-381"]

[dependencies]
ark-bls12-381 = { version = "0.6", default-features = false, features = ["curve"], optional = true }
ark-ec = { version = "0.6", default-features = false, optional = true }
ark-ff = { version = "0.6", default-features = false, optional = true }
ark-serialize = { version = "0.6", default-features = false, optional = true }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# arkworks 0.6 is on digest 0.10.
sha2 = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }

# The client's dependencies, by target: everywhere it builds, native only, wasm only.
[target.'cfg(any(not(target_arch = "wasm32"), target_os = "unknown"))'.dependencies]
# `http::Request<Bytes>` / `http::Response<Bytes>` are the `HttpTransport` trait's types.
bytes = { version = "1", default-features = false, optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
http = { version = "1", default-features = false, features = ["std"], optional = true }
# `TowerTransport` (feature `tower`): the service trait alone (no `tower` crate),
# and streaming bodies, read frame by frame up to `MAX_BODY_LEN`.
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
tower-service = { version = "0.3", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
# `std::time` on native; `Date.now()` / `performance.now()` on wasm, where `std` panics.
web-time = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"], optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
# Bodies are streamed there too, to stop reading past `MAX_BODY_LEN`.
reqwest = { version = "0.13", default-features = false, features = ["stream"], optional = true }
# JS futures (`fetch`, `setTimeout`) are not `Send`; wasm32-unknown-unknown is
# single-threaded, so the client and `ReqwestTransport` wrap them (`assume_send`).
send_wrapper = { version = "0.6", features = ["futures"], optional = true }

[dev-dependencies]
hex = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
bytes = "1"
http = "1"
# Seeds from the OS RNG: getrandom 0.3, which needs a `--cfg` on wasm32-unknown-unknown.
proptest = "1"
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "test-util", "time"] }
# `TowerTransport` over a real HTTP stack (tests/tower.rs), as the README shows it.
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-reqwest = { version = "0.6", default-features = false }

[[example]]
name = "fetch"
required-features = ["reqwest", "rustls"]

[[example]]
name = "verify"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
