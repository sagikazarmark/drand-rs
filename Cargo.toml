[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/drand-rs"
keywords = ["drand", "randomness", "bls", "beacon", "verifiable"]
categories = ["cryptography", "no-std", "wasm", "network-programming"]

[workspace.dependencies]
drand = { version = "0.2.0", path = "crates/drand", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "deny"

[[workspace.metadata.dagger.modules]]
name = "rust"
# Document every feature, as docs.rs does, but `native-tls`: it adds no API, and
# openssl-sys needs system OpenSSL, which the Rust image lacks. Features a crate
# doesn't have are skipped.
hack.doc = [
    "--features", "bls12-381,client,default-tls,rustls,test-chain",
    "--ignore-unknown-features",
]

[workspace.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
